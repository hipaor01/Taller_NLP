[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taller-nlp"
version = "0.1.0"
description = "Entorno de trabajo para el Taller de NLP"
requires-python = ">=3.10"
dependencies = [
    "langchain==1.3.18",
    "langchain-core==1.6.1",
    "langgraph==1.2.11",
    "langchain-openrouter==0.2.8",
    "langchain-huggingface==1.2.2",
    "sentence-transformers==6.0.1",
    "faiss-cpu==1.15.0",
    "rank-bm25==0.2.2",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "pydantic==2.12.5",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29,<8",
    "nbconvert==7.17.1",
]
test = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
